name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py -m 'not docker' -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t day12-agent:ci .

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RAILWAY_PROJECT_ID != '' && vars.RAILWAY_SERVICE_ID != '' && vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway up --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment production --service "${{ vars.RAILWAY_SERVICE_ID }}" --ci
      - run: |
          sleep 45
          curl -fsS "${{ vars.PUBLIC_URL }}/health"
